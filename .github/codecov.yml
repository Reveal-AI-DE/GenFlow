comment:
  layout: "header, diff, components"

component_management:
  individual_components:
    - component_id: geniflow-ui
      name: geniflow-ui
      paths:
        - geniflow-ui/**
    - component_id: geniflow-server
      name: geniflow-server
      paths:
        - geniflow/**

codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  status:
    patch: false
    project:
      default:
        target: auto
        threshold: 5%